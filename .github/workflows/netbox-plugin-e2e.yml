name: NetBox Plugin E2E

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/netbox-plugin-e2e.yml'
      - '.github/netbox-version-matrix.json'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'netbox_vault/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'playwright.config.ts'
      - 'pyproject.toml'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/netbox-plugin-e2e.yml'
      - '.github/netbox-version-matrix.json'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'netbox_vault/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'playwright.config.ts'
      - 'pyproject.toml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      netbox: ${{ steps.read.outputs.netbox }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read NetBox version matrix
        id: read
        run: |
          echo 'netbox<<EOF' >> "$GITHUB_OUTPUT"
          cat .github/netbox-version-matrix.json >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.netbox) }}
    name: E2E (NetBox v${{ matrix.netbox_version }})
    env:
      NETBOX_DOCKER_REF: release
      NETBOX_IMAGE: ${{ matrix.netbox_image }}
      NETBOX_TEST_PORT: 8001
      VAULT_TEST_PORT: 8201
      AZURE_TEST_PORT: 4998
      GCP_TEST_PORT: 8085
      AWS_TEST_PORT: 4567
      NETBOX_TEST_ADMIN_USER: admin
      NETBOX_TEST_ADMIN_EMAIL: admin@example.com
      NETBOX_TEST_ADMIN_PASSWORD: NetboxVaultTest123!
      VAULT_TEST_ROOT_TOKEN: root
      GCP_TEST_PROJECT_ID: test-project
      GCP_TEST_ACCESS_TOKEN: gcp-emulator-token
      AWS_TEST_REGION: us-east-1
      AWS_TEST_ACCESS_KEY_ID: test
      AWS_TEST_SECRET_ACCESS_KEY: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Install Playwright dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run plugin e2e suite
        run: ./scripts/run-e2e-tests.sh

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbox-plugin-e2e-artifacts-v${{ matrix.netbox_version }}
          path: |
            .e2e-artifacts/
            test-results/
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbox-plugin-e2e-report-v${{ matrix.netbox_version }}
          path: .playwright-report/
          if-no-files-found: warn

  publish-playwright-report:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Playwright reports
        uses: actions/download-artifact@v4
        with:
          pattern: netbox-plugin-e2e-report-v*
          path: report-artifacts
          merge-multiple: false

      - name: Render consolidated report index
        run: python scripts/render-playwright-report-index.py --artifacts-dir report-artifacts --output-dir playwright-report --base-commit "${GITHUB_SHA}"

      - name: Commit Playwright report
        run: |
          git config user.name 'NetBox Vault CI'
          git config user.email 'actions@users.noreply.github.com'
          git add playwright-report
          if git diff --cached --quiet; then
            echo 'Playwright report is unchanged.'
            exit 0
          fi
          git commit -m "docs: update Playwright report for ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
