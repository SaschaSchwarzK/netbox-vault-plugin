name: NetBox Docker Smoke Test

on:
  push:
    paths:
      - '.github/workflows/netbox-docker-smoke.yml'
      - '.github/netbox-version-matrix.json'
      - 'ci/**'
      - 'netbox_vault/**'
      - 'pyproject.toml'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/netbox-docker-smoke.yml'
      - '.github/netbox-version-matrix.json'
      - 'ci/**'
      - 'netbox_vault/**'
      - 'pyproject.toml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      netbox: ${{ steps.read.outputs.netbox }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read NetBox version matrix
        id: read
        run: |
          echo 'netbox<<EOF' >> "$GITHUB_OUTPUT"
          cat .github/netbox-version-matrix.json >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

  smoke-test:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.netbox) }}
    name: Smoke Test (NetBox v${{ matrix.netbox_version }})
    env:
      NETBOX_DOCKER_REF: release
      NETBOX_IMAGE: ${{ matrix.netbox_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run NetBox Docker smoke test
        run: ./ci/smoke-netbox-docker.sh

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbox-docker-smoke-logs-v${{ matrix.netbox_version }}
          path: .ci-artifacts/
          if-no-files-found: warn
